[workspace]
preview = ["pixi-build"]
# Keep the manager itself reproducible alongside pixi.lock. Update this pin
# deliberately when the lockfile is regenerated with a newer Pixi release.
requires-pixi = "==0.82.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[package]
name = "torchfits"
version = "1.3.1rc2"
description = "FITS I/O for PyTorch with native tensor reads, datasets, and transforms"
authors = ["Seb Fabbro <sebfabbro@gmail.com>"]

[package.build]
backend = { name = "pixi-build-cmake", version = "*"}

# Keep the conda package byte-identical in behavior to the wheels: compile
# the SAME sha256-pinned, patched vendored CFITSIO (extern/VERSIONS.txt) so
# every channel carries the PLIO buffer fix + BZIP2_1 support, plus the same
# tuned I/O constants.
[package.build.config]
extra-args = [
    "-DTORCHFITS_USE_VENDORED_CFITSIO=ON",
    "-DTORCHFITS_NIOBUF=80",
    "-DTORCHFITS_MINDIRECT=8640",
]

# Build dependencies - tools needed to build the package
# Note: cmake, ninja, and cxx-compiler are automatically provided by pixi-build-cmake
# The ``pytorch`` pins throughout this file are the wheel ABI lane (see the
# note in pyproject.toml): libtorch_python has no stable C++ ABI across torch
# minors, so they must not be widened.
[package.build-dependencies]
nanobind = ">=3.0.1"
scikit-build-core = ">=1.0.3"
cmake = ">=3.21"
ninja = ">=1.10"
python = ">=3.11"
pytorch = ">=2.14,<2.15"

# Host dependencies - libraries that will be linked into the package.
# CFITSIO itself is the sha256-pinned vendored tree (TORCHFITS_USE_VENDORED_CFITSIO),
# not a conda cfitsio package. bzip2 is libbz2 for the BZIP2_1 codec, matching
# packaging/conda/recipe.yaml.
[package.host-dependencies]
python = ">=3.11"
pytorch = ">=2.14,<2.15"
nanobind = ">=3.0.1"
zlib = ">=1.2.13"
bzip2 = ">=1.0.8"

# Run dependencies - packages needed at runtime
[package.run-dependencies]
pytorch = ">=2.14,<2.15"
numpy = ">=2.4.6"
pyarrow = ">=25.0.0"
zlib = ">=1.2.13"

# Workspace dependencies - development environment
[dependencies]
# torchfits = { path = "." }  # Don't add self-dependency - causes circular dependency
pytest = ">=9.0"
pytest-cov = ">=7.0"
ruff = ">=0.16.7"
mypy = ">=2.3.1"
pip = ">=24.0"
scikit-build-core = ">=1.0.3"
cmake = ">=3.21"
ninja = ">=1.10"
nanobind = ">=3.0.1"
pytorch = ">=2.14,<2.15"
numpy = ">=2.4.6"
pre-commit = ">=4.6"
# Lane-coupled, and rendered by scripts/release_lane.py (_LANE_PIXI_PYARROW):
# conda-forge pins strict libabseil minors, and older torch lanes need a
# pyarrow built against the older abseil. This cap is a solver constraint, not
# a version preference — do not hand-loosen it.
# conda-forge's newest build is 25.0.0; PyPI 26 has no feedstock build yet, so
# the dev env floor tracks the channel that can actually install it.
pyarrow = ">=25.0.0"
# Plotting and table interop for examples. Astropy and fitsio live in
# torchfits-harness.
matplotlib = ">=3.11"
pandas = ">=2.2"
polars = ">=1.43.2"
duckdb = ">=1.5.5"

[tasks]
# Development tasks
dev = "pip install -e . --no-build-isolation"
build = "pixi build"
# Install exactly the checked-in lock before the complete local gate.
current-source-gate = "pixi install --locked && pixi run preflight-push && pixi run ci-local"
# test runs the full suite including performance markers; the GHA PR matrix excludes them. release-gate runs the curated release subset (no marker filter) and must stay in lockstep with the CI release-gate job's file list -- tests/test_docs_integrity.py enforces that.
test = "pixi run dev && KMP_DUPLICATE_LIB_OK=TRUE pytest tests/"
release-gate = "pixi run dev && KMP_DUPLICATE_LIB_OK=TRUE pytest tests/test_package_isolation.py tests/test_docs_integrity.py tests/test_fits_schema.py tests/test_read_policy.py tests/test_examples_runner.py tests/test_transforms.py tests/test_release_smoke.py tests/test_public_boundary.py tests/test_http_probe_fixture.py -q && pixi run docs-contract && pixi run docs-links"
lint = "ruff check . && ruff format ."
preflight-push = "ruff check . && ruff format --check . && mypy src/torchfits && python -m compileall -q src/torchfits tests && pixi run check-lane && pixi run changelog-check"
# Regenerate the native type stub from the built extension; --check is the
# drift gate (also run as tests/test_native_stub.py).
gen-stub = "python scripts/gen_native_stub.py"
check-stub = "python scripts/gen_native_stub.py --check"
# Build a wheel and assert its contents contract (what the CI wheel-smoke job does).
wheel-smoke = "python -m pip wheel . --no-build-isolation --no-deps -w dist && python scripts/check_wheel_contents.py dist/*.whl"
# Verify the committed release-lane pins match scripts/torch_lanes.json.
check-lane = "python scripts/release_lane.py --check"
# `.cursor/skills` and `.cursor/hooks` are canonical and tracked; `.agents/` and
# `.codex/` are installed copies that .gitignore excludes. Run this after editing
# the canonical tree so a client never loads a stale skill under the same name.
agent-home = "python scripts/sync_agent_home.py"
agent-home-check = "python scripts/sync_agent_home.py --check"
# Resolve the [cpu] / [cuda] torch extra pins against download.pytorch.org
# indexes (guards the published-wheel ABI lane). Requires network.
check-torch-pins = "python scripts/check_torch_extra_pins.py"
# Merge conventional commits into the changelog's Unreleased section
# (scripts/update_changelog.py --release stamps it when cutting a release).
changelog-update = "python scripts/update_changelog.py"
changelog-check = "python scripts/update_changelog.py --check"
changelog-release = "python scripts/update_changelog.py --release"
ci-local = "bash scripts/ci_local.sh"
ci-local-fast = "CI_LOCAL_FAST=1 bash scripts/ci_local.sh"
setup-hooks = "pre-commit install"
pre-commit = "pre-commit run --all-files"
docs-build = "bash scripts/sync_docs_examples.sh && zensical build --clean"
docs-build-pages = "bash scripts/build_docs_pages.sh --root-from-head"
docs-serve = "zensical serve"
docs-contract = "bash scripts/sync_docs_examples.sh && zensical build --clean && pytest tests/test_docs_integrity.py tests/test_docs_snippets.py tests/test_package_isolation.py -q"
# Assumes site/ already exists (docs-contract or docs-build ran first).
docs-links = "pixi run python scripts/check_docs_links.py"

[feature.prod.dependencies]
python = "3.13.*"

[feature.test.dependencies]

[activation.env]
# Keep the project env hermetic: user-site packages (e.g. an older pyarrow or
# torch installed under ~/.local) would otherwise shadow the conda env.
PYTHONNOUSERSITE = "1"
# Harmless on Linux; required on macOS when both PyTorch and the extension
# link libomp (import torchfits, or pixi, before a second libomp loads).
KMP_DUPLICATE_LIB_OK = "TRUE"

[environments]
default = { features = ["prod"] }
test = { features = ["prod", "test"] }

[pypi-dependencies]
zensical = ">=0.0.61"
vos = ">=3.7, <4"
