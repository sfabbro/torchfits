name: Sanitizers

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: sanitizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: ASan+UBSan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux covers the vendored-CFITSIO paths used by the wheels;
        # macOS arm64 exercises the Apple mmap/endian codepaths.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          environments: test
          locked: true
          cache: true
      - name: Vendor CFITSIO
        run: bash extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      - name: Build with ASan+UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          # `-shared-libasan` is Linux clang; Apple clang links the ASan dylib
          # from `-fsanitize=address` and rejects that flag.
          cxx_flags="-fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cxx_flags="${cxx_flags} -shared-libasan"
          fi
          pixi run -e test -- pip install -e . --no-build-isolation --no-deps \
            --config-settings=cmake.define.CMAKE_CXX_FLAGS="${cxx_flags}" \
            --config-settings=cmake.define.CMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
        shell: bash
      - name: Native-heavy smoke under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          TORCHFITS_TABLE_BUFFERED: "1"
        run: >
          pixi run -e test -- pytest
          tests/test_write_fidelity.py tests/test_byteswap.py
          tests/test_compression_matrix.py tests/test_truncated_table_errors.py
          tests/test_multichunk_buffered_read.py tests/test_malformed_fits.py
          tests/test_table_file_ops.py tests/test_compressed_nulls.py
          -q --no-header
