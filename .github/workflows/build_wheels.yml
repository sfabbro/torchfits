name: Build Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Fail fast before vendoring / installing / building: the [cpu]/[cuda]
      # extra pins must stay on the torch 2.10 wheel lane this workflow builds
      # against (constraints-wheel.txt; CIBW_BEFORE_BUILD below).
      - name: Fail fast - torch flavor extras resolve on the wheel ABI lane
        run: |
          python -m pip install -q --upgrade pip packaging
          python scripts/check_torch_extra_pins.py
      - name: Vendor CFITSIO
        run: bash extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      - name: Install toolchain + test deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install "torch>=2.10,<2.11" --index-url https://download.pytorch.org/whl/cpu
          pip install numpy astropy fitsio pytest nanobind scikit-build-core psutil pyarrow
      - name: Install torchfits
        run: pip install -e . --no-build-isolation
      - name: Run tests
        run: pytest tests/ -q --maxfail=1

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      CIBW_BUILD: cp310-* cp311-* cp312-* cp313-*
      CIBW_SKIP: pp* *-musllinux_* *-manylinux_i686 *-win32
      CIBW_ARCHS_LINUX: x86_64
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      # ponytail: macOS x86_64 hits nanobind LTO + libtorch link failures on GHA; arm64 is primary.
      CIBW_ARCHS_MACOS: arm64
      CIBW_TEST_REQUIRES: numpy pyarrow pytest
      # Build against the same 2.10 ABI we test and document. Isolated builds
      # would otherwise resolve torch>=2.10 to 2.13+ and fail release smoke.
      CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
      CIBW_BEFORE_BUILD: |
        python -m pip install -U pip
        python -m pip install "scikit-build-core>=0.11.6" "nanobind>=2.10.2" "numpy>=1.20.0" "torch>=2.10,<2.11" --extra-index-url https://download.pytorch.org/whl/cpu
      CIBW_TEST_COMMAND: |
        pip install "torch>=2.10,<2.11" --extra-index-url https://download.pytorch.org/whl/cpu
        TORCH_LIB="$(python -c 'import os, torch; print(os.path.join(os.path.dirname(torch.__file__), "lib"))')"
        if [ "$(uname)" = "Darwin" ]; then
          export DYLD_FALLBACK_LIBRARY_PATH="$TORCH_LIB${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
        else
          export LD_LIBRARY_PATH="$TORCH_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        fi
        pytest -c /dev/null --noconftest {project}/tests/test_release_smoke.py -q
      CIBW_BEFORE_ALL_LINUX: bash ./extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      CIBW_BEFORE_ALL_MACOS: bash ./extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0 CMAKE_OSX_DEPLOYMENT_TARGET=11.0 PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
      CIBW_ENVIRONMENT_LINUX: PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --exclude libtorch_python.so --exclude libtorch_cpu.so --exclude libtorch.so --exclude libc10.so -w {dest_dir} {wheel}"
      # ponytail: PyTorch extensions resolve torch at runtime; delocate breaks @rpath linkage.
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Fail fast before cibuildwheel spins up the build matrix: the
      # [cpu]/[cuda] extra pins must stay on the torch 2.10 wheel lane this
      # workflow builds against (constraints-wheel.txt; CIBW_BEFORE_BUILD).
      - name: Fail fast - torch flavor extras resolve on the wheel ABI lane
        run: |
          python -m pip install -q --upgrade pip
          python scripts/check_torch_extra_pins.py
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  github_release:
    name: Create GitHub Release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'b') || contains(github.ref_name, 'a') }}
