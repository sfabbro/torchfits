name: Build Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (Ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The wheel ABI lane is whatever the committed tree tracks (a release
      # train: one torchfits release per torch minor, see torch_lanes.json).
      # Resolve it once, then pin torch everywhere below to that lane.
      - name: Resolve torch ABI lane
        run: |
          PINS="$(python scripts/release_lane.py --print-pins)"
          echo "$PINS"
          echo "TORCH_PIN=$(echo "$PINS" | sed 's/.*torch=//')" >> "$GITHUB_ENV"
      # Fail fast before vendoring / installing / building: the [cpu]/[cuda]
      # extra pins must stay on the torch lane this workflow builds against
      # (constraints-wheel.txt; cibw_before_build.sh).
      - name: Fail fast - torch flavor extras resolve on the wheel ABI lane
        run: |
          python -m pip install -q --upgrade pip packaging
          python scripts/check_torch_extra_pins.py
      - name: Vendor CFITSIO
        run: bash extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      - name: Install toolchain + test deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install "torch$TORCH_PIN" --index-url https://download.pytorch.org/whl/cpu
          pip install numpy astropy fitsio pytest nanobind scikit-build-core psutil pyarrow
      - name: Install torchfits
        run: pip install -e . --no-build-isolation
      - name: Run tests
        run: pytest tests/ -q --maxfail=1

  build_wheels:
    name: Wheels ${{ matrix.os }} ${{ matrix.arch }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15
            arch: arm64
    env:
      # Host-arch only in pyproject; each job builds one published arch.
      CIBW_ARCHS: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fail fast - torch flavor extras resolve on the wheel ABI lane
        run: |
          python -m pip install -q --upgrade pip packaging
          python scripts/check_torch_extra_pins.py
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Wheels only. An sdist on PyPI makes pip compile on unmatched
          # CPython / arch (Ubuntu 26.04 = 3.14 had no wheel on rc5).
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true

  github_release:
    name: Create GitHub Release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'b') || contains(github.ref_name, 'a') }}
