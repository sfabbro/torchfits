name: Comprehensive CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  TORCHFITS_EXAMPLE_FAST: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: python -m pip install "ruff>=0.16.1,<0.17" packaging
      - name: Duplicate C++ check
        run: python3 scripts/check_duplicate_cpp.py
      - name: Torch flavor extras resolve on PyTorch indexes
        run: python scripts/check_torch_extra_pins.py
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      # mypy needs torch/numpy; the pixi / release-gate jobs run it.

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve torch ABI lane
        run: echo "TORCH_PIN=$(python scripts/release_lane.py --print-pins | sed 's/.*torch=//')" >> "$GITHUB_ENV"
      - name: Vendor CFITSIO
        run: bash extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install "torch$TORCH_PIN" --index-url https://download.pytorch.org/whl/cpu
          pip install numpy astropy fitsio pytest nanobind scikit-build-core psutil pyarrow tomli
      - name: Build and install
        run: pip install -e . --no-build-isolation
      - name: Pytest
        run: pytest tests/ -q

  bench-smoke:
    name: Benchmark smoke (py3.13)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Resolve torch ABI lane
        run: echo "TORCH_PIN=$(python scripts/release_lane.py --print-pins | sed 's/.*torch=//')" >> "$GITHUB_ENV"
      - name: Vendor CFITSIO
        run: bash extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install "torch$TORCH_PIN" --index-url https://download.pytorch.org/whl/cpu
          pip install numpy astropy fitsio pytest nanobind scikit-build-core psutil pyarrow tomli
          pip install -e . --no-build-isolation
      - name: bench_cpp_backend
        run: python benchmarks/bench_cpp_backend.py

  docs-contract:
    name: Docs contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Resolve torch ABI lane
        run: echo "TORCH_PIN=$(python scripts/release_lane.py --print-pins | sed 's/.*torch=//')" >> "$GITHUB_ENV"
      - name: Vendor CFITSIO
        run: bash extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "torch$TORCH_PIN" --index-url https://download.pytorch.org/whl/cpu
          pip install numpy astropy fitsio pytest nanobind scikit-build-core psutil pyarrow tomli
          pip install -e . --no-build-isolation
      - name: Docs integrity
        run: pytest tests/test_docs_integrity.py tests/test_package_isolation.py -q
      - name: Zensical build
        run: |
          pip install "zensical>=0.0.52,<0.0.53"
          bash scripts/sync_docs_examples.sh
          zensical build --clean

  release-gate:
    name: Release gate (py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Resolve torch ABI lane
        run: echo "TORCH_PIN=$(python scripts/release_lane.py --print-pins | sed 's/.*torch=//')" >> "$GITHUB_ENV"
      - name: Vendor CFITSIO
        run: bash extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install "torch$TORCH_PIN" --index-url https://download.pytorch.org/whl/cpu
          pip install numpy astropy fitsio pytest nanobind scikit-build-core psutil pyarrow tomli
          pip install "pyarrow>=25,<26" "polars>=1.43.2,<2" "duckdb>=1.5.5,<2" "mypy==2.3.0"
          pip install -e . --no-build-isolation
      - name: Mypy type check
        run: mypy src/torchfits
      - name: Release gate tests
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: >-
          pytest tests/test_fitsio_upstream_smoke.py tests/test_astropy_upstream_smoke.py
          tests/test_package_isolation.py tests/test_docs_integrity.py tests/test_fits_schema.py
          tests/test_read_policy.py tests/test_examples_runner.py tests/test_scale_on_device.py
          tests/test_data.py tests/test_transforms.py tests/test_transforms_e2e.py
          tests/test_api.py tests/test_arrow_table_api.py tests/test_security.py
          tests/test_release_smoke.py tests/test_cli.py tests/test_public_boundary.py
          tests/test_http_probe_fixture.py tests/test_mps.py tests/test_audit_register.py -q
      - name: Docs contract
        run: |
          pip install "zensical>=0.0.52,<0.0.53"
          bash scripts/sync_docs_examples.sh
          zensical build --clean
          pytest tests/test_docs_integrity.py tests/test_package_isolation.py -q
      - name: Docs links
        run: python scripts/check_docs_links.py
