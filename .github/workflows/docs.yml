name: Documentation

on:
  push:
    branches:
      - main
  # Do not deploy from tags: github-pages env only allows `main`, and a tag
  # push would cancel the concurrent main deploy (see /edge/ 404 after rc2).
  # Stable docs are still built from the latest v* tag via build_docs_pages.sh
  # whenever main runs after a release.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (stable + edge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "zensical>=0.0.61"
      - name: Build Pages tree (stable=/ edge=/edge/)
        run: bash scripts/build_docs_pages.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site_pages

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Publishing is best-effort, not a check.  Forks (and any clone without a
    # Pages site configured) fail at configure-pages with a 404 that says
    # nothing about the docs, so the run would report a failure for an
    # infrastructure gap.  The build job above still gates the docs.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
