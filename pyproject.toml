[build-system]
requires = [
    "scikit-build-core>=1.0.3",
    "nanobind>=3.0.1",
    # The build-time torch must be the lane torch and no other. Under pip's
    # default build isolation this list is what the build environment resolves,
    # so a floor with no upper bound builds against whichever minor is newest
    # on PyPI and stamps that minor into the extension (CMake embeds it as
    # TORCHFITS_TORCH_ABI) -- which then refuses to import under the 2.14
    # this release is pinned to. Every source path inside this repo passes
    # --no-build-isolation and never sees the difference; this pin is what
    # protects a plain `pip install .` and the packager SDIST-README.txt is
    # written for. Keep it identical to the runtime pin below.
    "torch>=2.14,<2.15",
    "numpy>=2.4.6"
]
build-backend = "scikit_build_core.build"

[project]
name = "torchfits"
version = "1.3.0"
description = "FITS I/O for PyTorch with native tensor reads, datasets, and transforms"
authors = [{ name = "Seb Fabbro", email = "sebfabbro@gmail.com" }]
readme = "README.md"
license = "MIT"
keywords = ["fits", "astronomy", "pytorch", "tensor", "cfitsio"]
# Ship third-party license text (vendored CFITSIO) alongside the project
# license in every wheel/sdist (M17).
license-files = ["LICENSE", "extern/licenses/CFITSIO-LICENSE.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11"

# Core runtime dependencies for the library.
# These are automatically managed by pixi for conda packages
# but needed here for PyPI compatibility
dependencies = [
    # Do not loosen this upper bound. Published wheels are ABI-matched to the
    # 2.14 lane: libtorch_python has no stable C++ ABI across torch minors, so
    # a wheel built on 2.14 that pip resolves against a newer minor can crash
    # at import. Other torch minors ship as separate torchfits releases, one per
    # lane (scripts/torch_lanes.json, docs/install.md). Every other runtime
    # dependency is deliberately uncapped.
    "torch>=2.14,<2.15",
    # Floors name the oldest release that still has wheels for the minimum
    # supported Python (3.11) and is within one minor of the newest release.
    # numpy 2.5 dropped cp311, so 2.4.6 is the newest floor 3.11 can install;
    # 3.12+ resolves 2.5.x from the same specifier.
    "numpy>=2.4.6",  # Core numerical operations
    "pyarrow>=25.0.0",  # Table I/O (Arrow interchange)
]

[project.scripts]
torchfits = "torchfits.cli.main:main"

[project.urls]
Homepage = "https://github.com/astroai/torchfits"
Documentation = "https://astroai.github.io/torchfits/"
Repository = "https://github.com/astroai/torchfits"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pandas>=2.2",
    "matplotlib>=3.11",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "psutil",
]
docs = [
    "zensical>=0.0.61",
]
examples = [
    "matplotlib>=3.11",
]

# Torch build flavors — pick one. Extras cannot embed index URLs, so [cpu] /
# [cuda] resolve only when the matching download.pytorch.org index is
# reachable (PIP_EXTRA_INDEX_URL or pip.conf extra-index-url; see
# docs/install.md). Exact pins track the 2.14 ABI lane (see
# scripts/torch_lanes.json).
cpu = [
    # Thin CPU-only PyTorch: no CUDA runtime / cuDNN stack. Linux only —
    # macOS has no +cpu wheel; MPS ships inside the default macOS build.
    "torch==2.14.0+cpu; sys_platform == 'linux'",
]
cuda = [
    # CUDA-enabled PyTorch (cu130). Linux only — macOS has no
    # +cu130 wheels; MPS ships inside the default macOS torch build.
    "torch==2.14.0+cu130; sys_platform == 'linux'",
]

[tool.scikit-build]
cmake.source-dir = "src/torchfits/cpp_src"
cmake.build-type = "Release"
cmake.args = [
    "-DTORCHFITS_USE_VENDORED_CFITSIO=ON",
    "-DTORCHFITS_NIOBUF=80",
    "-DTORCHFITS_MINDIRECT=8640",
    # No .cu kernels. Wheels (and pip installs) build against the CPU
    # libtorch from download.pytorch.org/whl/cpu. CMakeLists.txt stubs
    # Caffe2 CUDA targets if a CUDA-enabled libtorch is used instead
    # (pixi GPU / CANFAR); do not point CUDA_TOOLKIT_ROOT_DIR at conda
    # here — that made blank-machine pip source builds look for conda.
    "-DUSE_CUDA=OFF",
    "-DCMAKE_C_FLAGS=-O3",
    "-DCMAKE_CXX_FLAGS=-O3",
]

# Compiled extension is installed inside the torchfits package; keep the
# source tree out of the wheel.
install.strip = false
wheel.packages = ["src/torchfits"]
wheel.exclude = ["torchfits/cpp_src/**"]

# Incremental builds via CMake/Ninja for fast iteration.
build-dir = "build/{wheel_tag}"

# GitHub Release may attach an sdist; PyPI does not (pip must not compile).
[tool.scikit-build.sdist]
exclude = [".cursor/**", ".pixi/**", ".github/**"]

# Published wheels: CPython 3.11–3.15, Linux glibc x86_64 + aarch64, macOS
# arm64. Built against CPU torch; the same wheel loads CUDA torch of the
# matching minor. Free-threaded (cp315t) and musl are out of scope.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32 cp31?t-*"
test-requires = ["numpy", "pyarrow", "pytest"]
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
before-build = "bash {project}/scripts/cibw_before_build.sh"
test-command = "bash {project}/scripts/cibw_test.sh {project}"

[tool.cibuildwheel.linux]
# Native arch only by default (GHA sets CIBW_ARCHS per job: x86_64 or aarch64).
archs = ["auto"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "yum install -y bzip2-devel && bash ./extern/vendor.sh --cfitsio-version extern/VERSIONS.txt"
environment = { PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu" }
repair-wheel-command = "auditwheel repair --exclude libtorch_python.so --exclude libtorch_cpu.so --exclude libtorch.so --exclude libc10.so -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
# cp315 macOS wheels are not published for 1.3.0: torch 2.14's own cp315 macOS
# wheel was built against CPython 3.15.0b3 headers and segfaults on the first
# tensor op outside the main thread (pytorch/pytorch#200779). The Linux cp315
# wheels are unaffected. Repeat the free-threaded skip: a platform-specific
# `skip` replaces the global one.
skip = "cp31?t-* cp315-*"
before-all = "bash ./extern/vendor.sh --cfitsio-version extern/VERSIONS.txt"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", CMAKE_OSX_DEPLOYMENT_TARGET = "14.0", PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu" }
# ponytail: PyTorch extensions resolve torch at runtime; delocate breaks @rpath.
repair-wheel-command = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: performance-oriented benchmark or stress tests",
    "integration: integration tests across multiple modules",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
# Keep the lint policy stable across ruff releases: ruff 0.16 expanded the
# default rule set (bandit S1xx, bugbear B, naming N, comprehensions C4, ...).
# Pin the classic default select so new ruff versions never churn the tree.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# The native type stubs are generated by scripts/gen_native_stub.py (and
# regenerated/checked by tests/test_native_stub.py and `pixi run check-stub`).
# Excluding them keeps the generator stdlib-only, so the drift gate runs
# wherever the extension and torch are importable rather than only where ruff is
# installed -- and stops `ruff format` from rewriting a generated file out from
# under the drift gate. `ruff check` still lints them.
exclude = ["src/torchfits/_C.pyi", "src/torchfits/_core.pyi"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas"]
ignore_missing_imports = true
