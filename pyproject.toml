[build-system]
requires = [
    "scikit-build-core>=1.0.3",
    "nanobind>=2.13.0",
    "torch>=2.10",
    "numpy>=1.20.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "torchfits"
version = "1.0.0"
description = "FITS I/O for PyTorch with native tensor reads, datasets, and transforms"
authors = [{ name = "Seb Fabbro", email = "sebfabbro@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["fits", "astronomy", "pytorch", "tensor", "cfitsio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.10"

# Core runtime dependencies for the library.
# These are automatically managed by pixi for conda packages
# but needed here for PyPI compatibility
dependencies = [
    # Published wheels are ABI-matched to the 2.13 lane (PyTorch has no
    # stable C++ ABI across minors). The lane pin keeps pip on the matching
    # minor; other torch minors ship as separate torchfits releases, one per
    # lane (scripts/torch_lanes.json, docs/install.md).
    "torch>=2.13,<2.14",
    "numpy>=1.20.0",  # Core numerical operations
    "pyarrow>=5.0",   # Table I/O (Arrow interchange)
]

[project.scripts]
torchfits = "torchfits.cli.main:main"

[project.urls]
Homepage = "https://github.com/astroai/torchfits"
Documentation = "https://astroai.github.io/torchfits/"
Repository = "https://github.com/astroai/torchfits"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.1.0",
    "mypy>=2.3.0",
    "astropy>=8.0",
    "fitsio>=1.4.0",
    "pandas>=1.0",
    "matplotlib>=3.11",
    "tomli>=2.0; python_version < '3.11'",
]
bench = [
    "astropy>=8.0",
    "fitsio>=1.4.0",
    "pandas>=1.0",
    "matplotlib>=3.11",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]
examples = [
    "matplotlib>=3.11",
]

# Torch build flavors — pick one. Extras cannot embed index URLs, so [cpu] /
# [cuda] resolve only when the matching download.pytorch.org index is
# reachable (PIP_EXTRA_INDEX_URL or pip.conf extra-index-url; see
# docs/install.md). Exact pins track the 2.13 ABI lane (see
# scripts/torch_lanes.json).
cpu = [
    # Thin CPU-only PyTorch: no CUDA runtime / cuDNN stack. Linux only —
    # macOS has no +cpu wheel; MPS ships inside the default macOS build.
    "torch==2.13.0+cpu; sys_platform == 'linux'",
]
cuda = [
    # CUDA-enabled PyTorch (cu129). Linux only — macOS has no
    # +cu129 wheels; MPS ships inside the default macOS torch build.
    "torch==2.13.0+cu129; sys_platform == 'linux'",
]

[tool.scikit-build]
cmake.source-dir = "src/torchfits/cpp_src"
cmake.build-type = "Release"
cmake.args = [
    "-DTORCHFITS_USE_VENDORED_CFITSIO=ON",
    "-DTORCHFITS_NIOBUF=80",
    "-DTORCHFITS_MINDIRECT=8640",
    "-DUSE_CUDA=OFF",
    # The extension has no .cu kernels; USE_CUDA=OFF is intentional. We link
    # libtorch from a CUDA-enabled wheel for the tensor API surface only, and
    # Caffe2's cuda.cmake probes unconditionally when libtorch was built with
    # CUDA, so point the toolkit at the conda prefix to satisfy its layout
    # expectations (no nvcc is ever run).
    "-DCUDA_TOOLKIT_ROOT_DIR=${CONDA_PREFIX}",
    "-DCUDAToolkit_ROOT=${CONDA_PREFIX}",
    "-DCMAKE_C_FLAGS=-O3",
    "-DCMAKE_CXX_FLAGS=-O3",
]

# Compiled extension is installed inside the torchfits package; keep the
# source tree out of the wheel.
install.strip = false
wheel.packages = ["src/torchfits"]
wheel.exclude = ["torchfits/cpp_src/**"]

# Incremental builds via CMake/Ninja for fast iteration.
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
markers = [
    "performance: performance-oriented benchmark or stress tests",
    "integration: integration tests across multiple modules",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
# Keep the lint policy stable across ruff releases: ruff 0.16 expanded the
# default rule set (bandit S1xx, bugbear B, naming N, comprehensions C4, ...).
# Pin the classic default select so new ruff versions never churn the tree.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["E402"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "torchfits._C"]
ignore_missing_imports = true
