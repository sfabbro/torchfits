repos:
  # v6 removed check-byte-order-marker and fix-encoding-pragma; none of the
  # hooks below were affected, so the bump is purely a pin change.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Byte-exact files must be left alone: a patch's context lines have to
      # match the target source verbatim (stripping their trailing whitespace
      # silently breaks the vendored-CFITSIO build), and docs/assets/ is
      # vendored third-party bundles that should stay identical to upstream.
      - id: trailing-whitespace
        exclude: ^(extern/patches/|docs/assets/)
      - id: end-of-file-fixer
        exclude: ^(extern/patches/|docs/assets/)
      # No exclude: the only file that ever needed one was .dsh/cordis.patch.yml,
      # which used a JavaScript type tag (``!!js ...``) that only its own parser
      # accepts. .dsh/ has been removed, and every remaining YAML file in the
      # tree — workflows, dependabot, the rattler-build recipe — is plain YAML.
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-duplicate-cpp
        name: Check for duplicate C++ file-scope functions
        entry: python3 scripts/check_duplicate_cpp.py
        language: system
        files: ^src/torchfits/cpp_src/.*\.cpp$
        pass_filenames: false
        always_run: false
      - id: docs-integrity
        name: Docs claims match the code
        entry: python3 -m pytest tests/test_docs_integrity.py -q
        language: system
        files: ^(docs/.*\.md|README\.md|AGENTS\.md|CLAUDE\.md|src/.*|scripts/.*|pyproject\.toml|pixi\.toml|\.gitignore)$
        pass_filenames: false
        always_run: false
      - id: agent-home-sync
        name: Agent-home copies match .cursor
        entry: python3 scripts/sync_agent_home.py
        language: system
        files: ^\.cursor/(skills|hooks)/
        pass_filenames: false
        always_run: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
